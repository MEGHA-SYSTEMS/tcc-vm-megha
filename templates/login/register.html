<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Login | PoupeMais</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS da página -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <!-- rodapé: este link deve ficar por ÚLTIMO -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/_footer.css') }}">

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<nav class="navbar navbar-expand-lg navbar-poupemais">

    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center"
           href="{{ url_for('index') }}">

            <img src="{{ url_for('static', filename='logo.png') }}"
                 alt="Logo PoupeMais"
                 class="logo-nav">

            <span class="nome-site">
                PoupeMais
            </span>

            <img src="{{ url_for('static', filename='img/Pesquisar.jpeg') }}"
                 class="icone-nav-img"
                 alt="Buscar">

        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse justify-content-end"
             id="navbarNav">

            <a href="{{ url_for('register') }}"
               class="btn-cadastro">

                É farmácia? Cadastre-se aqui

            </a>

        </div>

    </div>

</nav>



<!-- ==========================================
     LOGIN
========================================== -->

<main class="login-container">

    <h1>Entrar</h1>

    <p class="subtitulo">
        Faça login para acessar sua conta
    </p>


    <div class="card-login">

        {% if mensagem %}
        <div class="alert alert-danger" role="alert">
            {{ mensagem }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    value="{{ email or '' }}"
                    placeholder="Digite seu e-mail"
                    required>

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Digite sua senha"
                    required>

            </div>


            <div class="opcoes-login">

                <div class="lembrar">

                    <input
                        type="checkbox"
                        id="lembrar">

                    <label for="lembrar">
                        Lembrar de mim
                    </label>

                </div>


                <a href="{{ url_for('recovery') }}">
                    Esqueci minha senha
                </a>

            </div>


            <button
                type="submit"
                class="btn-login">

                Entrar

            </button>

        </form>

    </div>


    <p class="texto-login">

        Ainda não possui conta?

        <a href="{{ url_for('register') }}">
            Cadastre-se
        </a>

    </p>

</main>


{% include '_footer.html' %}


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
