<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Plataforma de PoupeMais</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>


  <header class="topo">

    <div class="menu-area">

      <div class="menu">
    ☰
</div>

        <div class="pesquisa">
            <i class="bi bi-search"></i>
        </div>

    </div>

    <div class="logo">
        <img src="{{url_for('static', filename='logo.png')}}" alt="">
    </div>

</header>
  <main class="login-container">

    <h1>Cadastre-se</h1>

    <p class="subtitulo">
      Para começar, você deve se registrar
    </p>

    <div class="card-login">

      <form>

        <div class="mb-3">
          <label class="form-label">
            Bairro
          </label>

          <input type="text" class="form-control" placeholder="ex: Centro">
        </div>

        <div class="mb-3">
          <label class="form-label">
           Rua
          </label>

          <input type="bairro" class="form-control" placeholder="ex:Novo Mundo">
        </div>

        <div class="mb-3">
          <label class="form-label">
            CEP
          </label>

          <input type="rua" class="form-control" placeholder="ex:15990-736">
        </div>

        <div class="mb-3">
          <label class="form-label">
           número
          </label>

          <input type="password" class="form-control" placeholder="ex:12">
        </div>

        <div class="mb-3">
          <label class="form-label">
          Cidade
          </label>

          <input type="password" class="form-control" placeholder="ex:Matão">
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="check">

          <label class="form-check-label" for="check">
            Concordo com os termos e condições
          </label>
        </div>

        <button type="submit" class="btn-login">
          Criar conta
        </button>

      </form>

    </div>

    <p class="texto-login">
      Já tem uma conta?
      <a href="#">Entre agora</a>
    </p>

  </main>

</body>

</html>
