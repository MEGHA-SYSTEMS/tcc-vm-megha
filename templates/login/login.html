<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Plataforma de PoupeMais</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>


  <header class="topo">

    <div class="menu-area">

      <div class="menu">
    ☰
</div>

        <div class="pesquisa">
            <i class="bi bi-search"></i>
        </div>

    </div>

    <div class="logo">
        <img src="{{url_for('static', filename='logo.png')}}" alt="">
    </div>

</header>
  <main class="login-container">

    <h1>Cadastre-se</h1>

    <p class="subtitulo">
      Para começar, você deve se registrar
    </p>

    <div class="card-login">

      {% if mensagem %}
      <div class="alert {{ 'alert-success' if sucesso else 'alert-danger' }}" role="alert">
        {{ mensagem }}
        {% if sucesso %}
          <a href="{{ url_for('login') }}" class="alert-link">Entrar</a>
        {% endif %}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('register') }}">

        <div class="mb-3">
          <label class="form-label" for="nome">Nome da farmácia</label>
          <input type="text" class="form-control" id="nome" name="nome"
                 value="{{ dados.get('nome', '') }}" placeholder="ex: Farmácia Popular" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="cnpj">CNPJ</label>
          <input type="text" class="form-control" id="cnpj" name="cnpj"
                 value="{{ dados.get('cnpj', '') }}" placeholder="ex: 00.000.000/0001-00" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" class="form-control" id="email" name="email"
                 value="{{ dados.get('email', '') }}" placeholder="ex: contato@farmacia.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="senha">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha"
                 minlength="6" placeholder="mínimo de 6 caracteres" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="confirmar_senha">Confirmar senha</label>
          <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha"
                 minlength="6" placeholder="repita a senha" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="bairro">Bairro</label>
          <input type="text" class="form-control" id="bairro" name="bairro"
                 value="{{ dados.get('bairro', '') }}" placeholder="ex: Centro" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="rua">Rua</label>
          <input type="text" class="form-control" id="rua" name="rua"
                 value="{{ dados.get('rua', '') }}" placeholder="ex: Novo Mundo" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="cep">CEP</label>
          <input type="text" class="form-control" id="cep" name="cep"
                 value="{{ dados.get('cep', '') }}" placeholder="ex: 15990-736" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="numero">Número</label>
          <input type="text" class="form-control" id="numero" name="numero"
                 value="{{ dados.get('numero', '') }}" placeholder="ex: 12" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="cidade">Cidade</label>
          <input type="text" class="form-control" id="cidade" name="cidade"
                 value="{{ dados.get('cidade', '') }}" placeholder="ex: Matão" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="termos" name="termos" value="1">
          <label class="form-check-label" for="termos">
            Concordo com os termos e condições
          </label>
        </div>

        <button type="submit" class="btn-login">
          Criar conta
        </button>

      </form>

    </div>

    <p class="texto-login">
      Já tem uma conta?
      <a href="{{ url_for('login') }}">
        Entre agora
    </a>
    </p>

  </main>

</body>

</html>
