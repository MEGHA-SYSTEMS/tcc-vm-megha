<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localização</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/localizacao.css') }}">
</head>

<body>

    <header>

        <div class="menu">
            ☰
        </div>
        <div class="logoloca">

        <img src="{{url_for('static',filename='logo.png')}}">
        </div>

        <button class="cadastro">
            É farmácia? Cadastre-se aqui
        </button>

        <div class="pin">
            📍
        </div>

    </header>


    <section class="conteudo">

        <div class="mapa">

            <div id="map"></div>

        </div>

        <div class="formulario">

            <h2>Endereço</h2>

            <label>Bairro</label>
            <input id="bairro" type="text" placeholder="ex: Centro">

            <label>Rua</label>
            <input id="rua" type="text" placeholder="ex: 15 de novembro">

            <label>CEP</label>
            <input id="cep" type="text" placeholder="ex: 15990-000">

            <label>Número</label>
            <input id="numero" type="text" placeholder="12">

            <label>Complemento</label>
            <input id="complemento" type="text" placeholder="Apartamento">

            <button id="buscar">
                Buscar
            </button>

        </div>

    </section>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/localizacao.js') }}"></script>

</body>

</html>
